<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stablo predmeta</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    margin: 30px;
    color: #1d2a33;
  }
  ul.stablo, ul.podstablo {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .cvor {
    cursor: pointer;
    user-select: none;
    padding: 3px 0;
  }
  .cvor:hover { color: #0b5c8a; }
  .znak {
    display: inline-block;
    width: 1.1em;
    font-family: Consolas, monospace;
    font-weight: bold;
  }
  .podstablo {
    display: none;            /* sakriveno po defaultu */
    margin-left: 1.6em;
  }
  .podstablo li { padding: 2px 0; }
</style>
</head>
<body>

<ul class="stablo">
  <li>
    <div class="cvor" onclick="promijeni(this)"><span class="znak">+</span>Prva godina</div>
    <div class="podstablo">
      <ul class="podstablo-lista">
        <li>IM1</li>
        <li>IM2</li>
        <li>OE</li>
        <li>EES</li>
        <li>OF</li>
        <li>TP</li>
      </ul>
    </div>
  </li>
  <li>
    <div class="cvor" onclick="promijeni(this)"><span class="znak">+</span>Druga godina</div>
    <div class="podstablo">
      <ul class="podstablo-lista">
        <li>IM3</li>
        <li>SS</li>
        <li>RM</li>
        <li>DE</li>
        <li>OOP</li>
      </ul>
    </div>
  </li>
</ul>

<script>
function promijeni(cvor) {
  var sadrzaj = cvor.nextElementSibling;       // div sa podstablom
  var znak = cvor.querySelector(".znak");
  var skriveno = window.getComputedStyle(sadrzaj).display === "none";
  sadrzaj.style.display = skriveno ? "block" : "none";
  znak.textContent = skriveno ? "-" : "+";
}
</script>

</body>
</html>
